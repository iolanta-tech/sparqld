name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo build --locked
      - run: cargo test --locked

  publish-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo build --locked
      - run: cargo install tokei --version 12.1.2 --locked
      - run: cargo install --git https://github.com/ktk/sq
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          mkdir -p .tools
          curl -fsSL --retry 3 -o /tmp/apache-jena.tar.gz \
            https://archive.apache.org/dist/jena/binaries/apache-jena-3.17.0.tar.gz
          tar -xzf /tmp/apache-jena.tar.gz -C .tools
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --with dev
      - run: poetry run j docs language-history
      - run: poetry run mkdocs gh-deploy --force --strict
