name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo build --locked
      - run: cargo test --locked

  # Blocking: reviewdog fails the job on Vale error-level alerts.
  vale:
    name: Vale
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v3
        with:
          version: "3.24.0"
          # Reader-facing prose; skip examples/, queries/, results/, contexts/.
          files: >-
            ["README.md", "docs/index.md", "docs/quickstart", "docs/reference",
            "docs/project", "docs/conversations"]
          # Fail only on Vale error-level alerts; warnings/suggestions annotate
          # but do not block the job.
          fail_level: error
          filter_mode: file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docs:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo build --locked
      - run: cargo install tokei --version 12.1.2 --locked
      - run: cargo install --git https://github.com/ktk/sq
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          mkdir -p .tools
          curl -fsSL --retry 3 -o /tmp/apache-jena.tar.gz \
            https://archive.apache.org/dist/jena/binaries/apache-jena-3.17.0.tar.gz
          tar -xzf /tmp/apache-jena.tar.gz -C .tools
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install poetry==2.2.1
      - run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
      - run: poetry install --with dev
      - run: poetry run pytest
      - run: git branch main origin/main
        if: github.event_name == 'pull_request'
      - run: poetry run j docs language-history
      - run: poetry run mkdocs build --strict
      - run: poetry run mkdocs gh-deploy --force --strict
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
