[package]
# @todo(riddles-cli): Add an independent Riddles command-line extractor.
# description: >
#   Convert this package into a Cargo workspace and add a publishable `riddles`
#   member crate, installed independently with `cargo install riddles`. Keep
#   `sparqld` independently installable with `cargo install sparqld`.
#
#   `riddles --help` exposes the agent-facing `mermaid` and `next` commands,
#   while `describe` and `extract` remain stable, documented protocol commands
#   hidden from ordinary help. `describe` writes one versioned JSON-LD extractor
#   descriptor to stdout, with a stable identity and positive Python and Rust
#   globs. `extract` reads one JSON request from stdin containing a canonical
#   absolute `path` and root-relative `sourceUrl`, opens that path, and writes
#   one ordinary JSON-LD document to stdout without choosing named graphs.
# syntax: |
#   A source marker carries a global ID and headline, followed by a contiguous
#   YAML-in-comment block containing a required multiline description and an
#   optional blocked-by sequence. Python uses hash comments and Rust uses slash
#   comments; parsing stops at the first non-comment line.
# output:
#   puzzleIri: urn:riddle:<id>
#   type: urn:riddle:Puzzle
#   properties:
#     - schema:headline
#     - schema:description
#     - urn:riddle:source
#     - urn:riddle:startLine
#     - urn:riddle:endLine
#     - urn:riddle:blockedBy
# behavior:
#   - Map every blocker ID directly to urn:riddle:<id>; local and cross-file
#     blockers therefore have identical RDF identities.
#   - Reject duplicate IDs in one source. sparqld detects duplicates across
#     source contributions.
# failures:
#   - For malformed YAML, missing required data, invalid blocker values, or a
#     duplicate source ID, write a source-positioned diagnostic to stderr and
#     exit nonzero.
# acceptance:
#   - Test descriptor output and ordinary-help visibility.
#   - Golden-test deterministic Python and Rust output with multiple riddles,
#     multiline descriptions, local and cross-file blockers, source positions,
#     ordinary comments, and every declared failure.

# @todo(riddles-views): Add direct Riddles graph and work-list commands.
# description: >
#   Add `riddles mermaid` and `riddles next` to the future Riddles crate. Both
#   require SPARQLD_ENDPOINT, the base URL of an already running sparqld server;
#   neither command starts, stops, reloads, or otherwise manages that server.
#
#   `mermaid` queries every current urn:riddle:Puzzle and urn:riddle:blockedBy
#   edge, then writes raw Mermaid source for the complete dependency graph.
#   `next` writes a stable Markdown list of every unblocked riddle, including
#   its ID, headline, and source location. A riddle is unblocked only when none
#   of its blockers remains a current urn:riddle:Puzzle resource.
# acceptance:
#   - Test endpoint errors, malformed results, empty datasets, cycles,
#     blocked/unblocked riddles, and deterministic Mermaid and Markdown output.
# blocked-by:
#   - riddles-integration

