name = "sparqld"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
description = "A live, read-only SPARQL server for RDF files"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/iolanta-tech/sparqld"
homepage = "https://github.com/iolanta-tech/sparqld"
documentation = "https://sparqld.iolanta.tech"
readme = "README.md"
keywords = ["rdf", "sparql", "linked-data", "knowledge-graph"]
categories = ["command-line-utilities", "database"]

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
form_urlencoded = "1"
globset = "0.4"
log = "0.4"
notify = "8"
oxhttp = { version = "0.3", default-features = false, features = ["server"] }
oxigraph = { version = "0.5", default-features = false }
percent-encoding = "2"
serde-saphyr = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
