[package]
name = "sparqld"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
form_urlencoded = "1"
log = "0.4"
notify = "8"
oxhttp = { version = "0.3", default-features = false, features = ["server"] }
oxigraph = { version = "0.5", default-features = false }
percent-encoding = "2"
serde-saphyr = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
