StylesPath = styles
MinAlertLevel = suggestion
Vocab = sparqld

# Pin the package zip so `vale sync` in CI cannot drift on a floating tag.
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip

# Published documentation prose. Run Vale against docs/ paths that hold
# reader-facing pages; skip examples/, queries/, results/, and contexts/
# (data fixtures) when invoking the CLI.
[*.md]
BasedOnStyles = Vale, Microsoft, sparqld
# Brand names and crate/path spellings both appear on purpose (Oxigraph vs
# oxigraph). Keep Vocab for spelling; do not enforce a single casing.
Vale.Terms = NO
# ADRs and reference prose often keep expanded forms ("is not", "does not")
# for precision; Microsoft prefers contractions.
Microsoft.Contractions = NO
# House Vocab omits `against`; Microsoft.Vocab would still flag it.
Microsoft.Vocab = NO
# House HeadingAcronyms allows `HTTP`; Microsoft.HeadingAcronyms would not.
Microsoft.HeadingAcronyms = NO
# Material icon shortcodes in headings break sentence-case detection.
Microsoft.Headings = NO
# Skip Jinja/MkDocs tag bodies (`{% raw %}`, `{% endraw %}`, includes).
TokenIgnores = (?s)\{\%.*?\%\}

# Agent guidance is not published documentation (`exclude_docs` in mkdocs.yml).
[**/AGENTS.md]
BasedOnStyles =

# These pages mirror GitHub issue descriptions, which are edited on GitHub.
[docs/project/roadmap/github-issues/*.md]
BasedOnStyles =
